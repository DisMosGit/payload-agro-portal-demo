schema: spec-driven

context: |
  Stack: Payload CMS 3 on the Next.js App Router, PostgreSQL, TypeScript.
  Domain: demo content site with four public sections: news, articles, service points on a map, equipment listings.
  The public frontend is strictly read-only: no forms, no client-side writes, no edit or delete actions.
  All content mutations go through the authenticated Payload admin; collection access control is the enforcement point, never UI-only guards.
  No map provider is chosen yet; do not assume one.
  Geospatial fields need the PostGIS extension on PostgreSQL.
  Stay compatible with the Node engines in package.json and with PostgreSQL; no MongoDB-specific features.
  Write all OpenSpec artifacts in English.

rules:
  proposal:
    - Name the public sections the change touches, or state that it touches none.
    - State what is out of scope.
  specs:
    - State whether each content requirement is read-only for unauthenticated users.
  design:
    - Do not choose a map provider; list it under Open Questions until one is decided.
    - In Payload 3.93, `slugField()`'s admin input starts locked and its hook does not fill the slug before required validation; when a design uses it, plan an explicit slug or a `beforeValidate` guard.
  tasks:
    - Use one task group per collection or public section touched, not one per layer.
    - Use positional path filters, not `--`, in verification commands (`pnpm test:e2e tests/e2e/<file>.spec.ts`), and state prerequisites such as the Playwright browser install and the dev-server restart.

operations:
  apply:
    guidance:
      - Regenerate payload-types.ts and importMap.js after collection or admin-component changes; never hand-edit them.
      - Keep tsc --noEmit, pnpm lint, and pnpm test:int green for collection or access-control changes.
      - Run pnpm test:e2e for frontend changes.
      - Install the Playwright browser once with `pnpm exec playwright install chromium`.
      - Restart the dev server after changing `payload.config.ts` or a collection config; Next hot reload does not re-register collections.
      - Run one suite with a positional path such as `pnpm test:e2e tests/e2e/<file>.spec.ts`, not the `--` form, which runs every suite.
      - After a dev-server restart, request `/admin/login`, `/articles`, `/news`, and `/admin/collections/articles/create` once before e2e; the admin suite's `beforeAll` has a 30-second limit, and the article block editor is a lazily compiled Next chunk whose first render takes over a minute cold and about a second once warm.
      - "Size timeouts to the measured failure: give the cold first block render an explicit expect timeout of up to ~180 s, keep other waits short, and do not raise a whole-suite timeout above ~240 s; two 600 s runs were spent waiting for selectors that never existed."
      - "Dump admin `outerHTML` with a throwaway spec (~20 s) before asserting on unfamiliar markup; do not guess selectors inside a long-lived suite."
      - "Payload `admin.condition` on group or array children receives the sibling object as its second argument; `(data) => data.enabled` never reveals the fields."
      - "Playwright can beat admin hydration: a checkbox toggled before the form hydrates leaves React state unchanged. Re-toggle inside `expect(async () => …).toPass()` instead of adding sleeps."
      - "Upload relationship fields have no `input[type=file]`; select with `.upload__listToggler` → `.drawer__content tbody tr` → `button.default-cell__first-cell` and assert the filename link."
      - "Host-run uploads land in `./media` while the Compose app serves the `media` named volume; upload through the running app's REST API when a test or screenshot must render the file."
      - "Keep Vitest `fileParallelism: false` and Playwright `workers: 1`; the suites share one database and race on Payload schema pushes and published rows."
  archive:
    guidance:
      - Run openspec validate before archiving.
      - Confirm no change adds a write path to the public frontend or weakens admin-only mutation access.
